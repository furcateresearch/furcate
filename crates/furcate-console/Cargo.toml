[package]
name = "furcate-console"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "One terminal for the machine and the network it belongs to"

[[bin]]
name = "furcate-console"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
libc.workspace = true
# The browser terminal (`furcate-console web`): the order desk is reached with
# the same HTTP client every node uses; the rest is hashing and randomness.
furcate-api = { path = "../furcate-api" }
sha2.workspace = true
hex.workspace = true
getrandom.workspace = true
data-encoding.workspace = true

# An edition adds to the console through `furcate_console::extension`, from a
# crate that depends on this one. Nothing here names it.
