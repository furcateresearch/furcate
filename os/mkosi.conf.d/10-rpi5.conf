# Raspberry Pi 5: `mkosi -C os --profile rpi5`, or os/build.sh rpi5.
#
# %D is the os/ directory (mkosi -C os).

[Match]
Profiles=rpi5

[Output]
Format=disk
ImageId=furcate-os-rpi5
RepartDirectories=%D/boards/rpi5/repart.d
# The Pi firmware loads kernel and initrd from the boot partition itself; no
# UKI or split kernel is produced. The /usr root hash is written beside the
# image for boards/rpi5/postoutput.
SplitArtifacts=roothash

[Build]
Environment=FURCATE_BOARD=rpi5

[Content]
Hostname=furcate-pi5
# The raspi kernel by its ABI version, not the linux-image-raspi metapackage,
# which pulls in the whole linux-firmware set for other hardware.
Packages=
        linux-image-7.0.0-1020-raspi
        linux-firmware-raspi
        rpi-eeprom
        raspi-utils-core
        raspi-utils-otp
        i2c-tools
        gpiod
        dracut
        libgnutls30t64
        rpicam-apps-core
        libcamera-ipa
BuildPackages=
        build-essential
        cmake
        pkg-config
        libgnutls28-dev
        curl
        ca-certificates
        git
        linux-headers-7.0.0-1020-raspi
BuildScripts=%D/boards/rpi5/rpi-fw-crypto.build.chroot
        %D/boards/rpi5/eeprom.build.chroot
        %D/boards/rpi5/hailo.build.chroot
PostInstallationScripts=%D/boards/rpi5/postinst.chroot
PostOutputScripts=%D/boards/rpi5/postoutput
