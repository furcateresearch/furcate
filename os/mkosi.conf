# Furcate OS base image, shared by every board: Ubuntu 26.04 LTS (resolute).
#
# The base holds the kernel, board firmware, systemd and Ubuntu packages
# and nothing of Furcate. Furcate arrives as signed system extensions
# (os/extensions/), which is what lets it update without a reinstall.
#
# Build through os/build.sh, which pins the version and runs the checks that
# have to hold before an image may be published.

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main,universe,restricted
Architecture=arm64

[Output]
ImageId=furcate-os
OutputDirectory=mkosi.output
CompressOutput=no

[Build]
# The board build script fetches pinned sources (checked by sha256).
WithNetwork=yes

[Content]
Bootable=no
WithDocs=no
CleanPackageMetadata=yes
Hostname=furcate
Locale=C.UTF-8
Timezone=UTC
Packages=
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        kmod
        libcryptsetup12
        cryptsetup-bin
        systemd-cryptsetup
        dmsetup
        e2fsprogs
        fdisk
        openssh-server
        sudo
        iproute2
        iputils-ping
        wireguard-tools
        ca-certificates
        openssl
        zstd
        less
        vim-tiny
        tpm2-tools
        iwd
        wireless-regdb
        bluez
        alsa-utils
        systemd-journal-remote
        nftables

ExtraTrees=rootfs
# mkosi.postinst.chroot next to this file runs by name; the board's own
# post-installation script is listed in its mkosi.conf.d file.
