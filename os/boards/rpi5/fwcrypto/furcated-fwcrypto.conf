# furcated signs with the OTP device key through the broker's socket
# (/run/furcate-os/fwcrypto.sock, group furcate-fwcrypto). The device lines
# serve the transition path only: a furcated that opens the mailbox itself,
# with /etc/furcate/fwcrypto-direct set (60-furcate-fwcrypto.rules).
[Service]
DeviceAllow=/dev/vcio_crypto rw
DeviceAllow=/dev/vcio rw
SupplementaryGroups=furcate-fwcrypto
