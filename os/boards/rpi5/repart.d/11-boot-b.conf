# Partition 3: boot slot B: kernel, initrd, device trees, config.txt, cmdline.txt.
# Slot B starts as a copy of slot A (its cmdline names usr-a), so a stray
# tryboot before the first base update boots the same system.
[Partition]
Type=ebd0a0a2-b9e5-4433-87c0-68b6b72699c7
Label=boot-b
Format=vfat
CopyFiles=/boot/furcate/slot:/
SizeMinBytes=256M
SizeMaxBytes=256M
