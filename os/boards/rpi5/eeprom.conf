# Raspberry Pi 5 bootloader EEPROM settings for Furcate OS.
#
# Pi 5 boards ship with USB boot enabled; this is the order Furcate OS expects
# when the system is on USB: SD first (so an SD card can still rescue the
# board), then USB mass storage, then NVMe, then restart the sequence.
#   0xf = restart, 6 = NVMe, 4 = USB, 1 = SD (read right to left)
# Check the current value on the device with: rpi-eeprom-config
# Apply this file with:  sudo rpi-eeprom-config --apply /usr/share/furcate-os/rpi5/eeprom.conf
[all]
BOOT_UART=1
POWER_OFF_ON_HALT=0
BOOT_ORDER=0xf641
