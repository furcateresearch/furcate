# Kernel messages on the console (HDMI tty1 and the serial port): emergency
# and alert only, so the login screen stays readable. Every kernel message
# still reaches the journal (journalctl -k). The distribution's
# 55-console-messages.conf sets 4, which still prints errors and critical
# messages such as the supply's "Undervoltage detected!" (critical) and the
# dm-verity "Unrecognized verity feature request: root_hash_sig_key_desc"
# lines (errors). Those dm-verity lines are expected: systemd first asks the
# kernel to check an extension's signed root hash, this kernel has no
# in-kernel root hash signature support and refuses, and systemd then checks
# the signature in userspace against /usr/lib/verity.d before it activates
# the image; systemd has no setting to skip the kernel attempt. The same
# level is set on the kernel command line (loglevel=2) for the boot before
# this file is read. For debugging, `sysctl kernel.printk="7 4 1 7"`.
kernel.printk = 2 4 1 7
