# Name resolution through systemd-resolved (with mDNS for <hostname>.local).
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf

# Bridges a board running an older base carried in /etc (2026-10-11), each a
# copy of what this base ships under /usr: post-merge after systemd-sysext,
# networkd after systemd-sysext. Removed so they cannot outlive the base.
r /etc/systemd/system/systemd-sysext.service.d/20-post-merge-bridge.conf
r /etc/systemd/system/systemd-networkd.service.d/20-after-sysext-bridge.conf
