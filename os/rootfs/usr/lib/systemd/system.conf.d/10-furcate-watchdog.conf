# Furcate OS: the hardware watchdog. systemd pings it every 15 s; if the
# system stops (a kernel hang, PID 1 stuck, a freeze from a weak supply) the
# board resets itself 30 s later instead of waiting for someone to pull the
# power. On a reboot or shutdown that hangs, the watchdog resets it after 10
# minutes. The Pi 5 watchdog (bcm2835-wdt) counts at most ~16 s in hardware;
# the kernel's watchdog core covers the 30 s by pinging it in between while
# systemd keeps pinging.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
