# Furcate OS: merge only what the selector chose, only if its dm-verity root
# hash carries a valid signature, and check the result afterwards.
[Unit]
Wants=furcate-extension-select.service
After=furcate-extension-select.service

[Service]
# The udev rules in /usr before the merge, so post-merge re-applies only the
# rules the merge added or changed.
ExecStartPre=-/usr/libexec/furcate-os/post-merge --before
ExecStart=
ExecStart=/usr/bin/systemd-sysext refresh --image-policy=root=signed:=absent
ExecStartPost=-/usr/libexec/furcate-os/extension-check
# Units, users, udev rules and network files shipped in extensions take
# effect in this boot (the boot transaction and udev's coldplug predate the
# merge). It queues targets without waiting: this unit runs before
# sysinit.target, which everything it queues is ordered after.
ExecStartPost=-/usr/libexec/furcate-os/post-merge
