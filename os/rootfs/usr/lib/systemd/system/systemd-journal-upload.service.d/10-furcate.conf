# Furcate OS: ship this node's journal, live, to its controller, so the log
# of a node that froze or lost power is readable on the controller.
#
# Off until JOURNAL_REMOTE_URL is set in /etc/furcate/node.conf; it must be
# an http:// URL on the Furcate overlay (10.90.0.0/16 or a *.internal name):
# the overlay's WireGuard tunnel authenticates and encrypts the stream, so the
# node needs no TLS client key of its own (journal-upload-check). The cursor
# is saved, so after a reconnect the upload resumes where it stopped.
# furcate-journal-upload-config.path restarts it when node.conf changes.
[Unit]
After=network-online.target furcate-wg.service
Wants=network-online.target

[Service]
EnvironmentFile=-/etc/furcate/node.conf
ExecCondition=/usr/libexec/furcate-os/journal-upload-check
ExecStart=
ExecStart=/usr/lib/systemd/systemd-journal-upload --save-state --url=${JOURNAL_REMOTE_URL}
Restart=on-failure
RestartSec=30s
