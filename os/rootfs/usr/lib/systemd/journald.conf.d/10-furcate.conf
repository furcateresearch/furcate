# Furcate OS: keep the journal across reboots on the state partition, and
# write it out every 5 s (the default is 5 min), so the last seconds before a
# freeze or a power cut are on disk. The cost is more small writes to the SD
# card or SSD: with the default 5 min a quiet node writes the journal a few
# times an hour, now up to 12 times a minute while something logs. Sizes are
# capped so the journal never takes more than 256 MB, and keeps 1 GB free.
[Journal]
Storage=persistent
SyncIntervalSec=5s
SystemMaxUse=256M
SystemKeepFree=1G
SystemMaxFileSize=32M
