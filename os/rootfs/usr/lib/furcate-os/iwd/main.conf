# iwd on Furcate OS. Addresses come from systemd-networkd
# (25-wireless.network), so iwd only associates. Known networks live in
# /var/lib/iwd on the state partition and are joined automatically at boot
# and after a drop. Between the bands of one network iwd ranks by expected
# throughput; the modifier makes 5 GHz preferred when both are usable, and
# 2.4 GHz is used when 5 GHz is not.
[General]
EnableNetworkConfiguration=false

[Network]
NameResolvingService=systemd

[Rank]
BandModifier5GHz=1.5
