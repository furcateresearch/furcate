# The account Furcate's services run as.
#
# Declared rather than created by a maintainer script, so the definition ships
# with the package and systemd-sysusers applies it idempotently at install and
# at every boot. A postinst that ran `useradd` would do the same thing worse:
# it would run once, on one path, and leave nothing behind describing what it
# made.
#
# Not DynamicUser=. That is the modern default and it is wrong here — a dynamic
# account gets a fresh identity each start and can only reach the directories
# systemd manages for it, while this one has to own a key sealed to the
# machine's TPM, open /dev/tpmrm0, and hold files that outlive any single run.
#
# No shell and no home: nothing here is meant to be logged into, and a home
# directory is precisely the thing this account exists to stop mattering.
u furcate - "Furcate site operations" /var/lib/furcate /usr/sbin/nologin

# The TPM, which is the whole point of the account.
#
# `DeviceAllow=/dev/tpmrm0` in the unit is a cgroup policy: it says the service
# may reach that device *class*. It does not touch file permissions, and
# /dev/tpmrm0 is `tss:tss 0660` — so without this line the packaged agent opens
# it, gets EACCES, and cannot read the identity it exists to hold. The
# hand-installed arrangement worked only because it ran as a human who happened
# to be in `tss`.
#
# Here rather than `SupplementaryGroups=tss` in the unit, because systemd
# refuses to start a service naming a group that does not exist — which would
# turn "this machine has no TPM" into "this service will not start". sysusers
# creates the group if it is missing, so both machines behave.
m furcate tss
