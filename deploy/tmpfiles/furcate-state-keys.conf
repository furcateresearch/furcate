# Ownership of the two sealed key directories, repaired on every boot.
#
# Both hold a key sealed to this machine's TPM and both are read by a process
# running User=furcate — node-key by furcated (node_signing_key(), which is the
# receipt-signing identity) and verifier-key by the daemon that verifies the
# site's members (verifier_signing_key()). The files are mode 0660, so ownership is the whole
# access decision: root:root and the daemon that owns the key cannot read it.
#
# Why this file exists rather than trusting the directories to stay correct:
# systemd chowns an exec directory RECURSIVELY to the unit's User=/Group= on
# every start (systemd.exec(5)). A single root unit declaring
# StateDirectory=furcate therefore rewrites ownership of this entire subtree,
# not just the top level. That happened — furcate-health-monitor.service, root,
# on an hourly timer — and it is a nasty failure because the daemon holds the
# unsealed key in RAM and keeps working: nothing breaks until the next restart,
# by which time the cause is hours in the past. Recovery would have meant
# re-enrolling both nodes.
#
# The root cause is fixed in the units: no root unit declares StateDirectory=furcate.
# This is the backstop, because the cost of getting it wrong is re-enrolment and
# the cost of this line is nothing.
#
# Z, not z: recursive, so the seal.priv/seal.pub inside are covered too.
# Mode is '-' deliberately — ownership is what drifts; the modes are correct and
# are set by the code that writes the files.
#
# operator-key/ and ssh-ca/ are deliberately NOT here. They are read by root
# only — furcate-console and /opt/ops/bin/furcate-ssh — and furcated merely
# tests them for existence. They must stay root-owned.
Z /var/lib/furcate/node-key     - furcate furcate -
Z /var/lib/furcate/verifier-key - furcate furcate -
