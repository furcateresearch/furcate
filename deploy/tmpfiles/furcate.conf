# Only what a unit's own directory settings cannot express.
#
# StateDirectory=, RuntimeDirectory= and ConfigurationDirectory= are preferred
# for everything else, because they keep a directory's lifecycle attached to the
# service that needs it rather than in a second file that drifts from it.
#
# Two cases need this file.
#
# /var/lib/furcate must be present and owned before *any* of the units start,
# because several read from it and only one declares StateDirectory=. Leaving
# that to whichever unit happened to start first is a race that would surface as
# an empty peer set or a missing identity.
#
# 0755, matching StateDirectoryMode= in the units — and it has to match. The
# overlay's privileged helper holds CAP_NET_ADMIN and therefore not
# CAP_DAC_OVERRIDE, so it cannot enter a directory it does not own, and this is
# the exchange point where the agent leaves the WireGuard plan for it. This line
# said 0750 while the units said 0755, which is a third statement of one fact
# and the only one that runs at boot: it would have quietly undone the fix on
# the next restart.
d /var/lib/furcate 0755 furcate furcate -
# What a box is made of is nobody else's business, and the mode belongs here
# rather than in the unit: StateDirectoryMode would have taken the parent with it.
d /var/lib/furcate/boxes 0700 furcate furcate -

# /etc/furcate, because ConfigurationDirectory= in a unit only sets the mode of
# a directory systemd *creates*. A machine where /etc/furcate already existed —
# every machine that ran Furcate before it was packaged — keeps whatever mode it
# had. On one site controller that was 0700: it could not traverse its own
# configuration, every file read as absent, and it ran compiled-in policy while
# the operator's rules sat inside. tmpfiles applies on every boot, so this
# repairs an existing directory rather than only getting new ones right.
#
# Root-owned: these are an operator's declarations, written by a human with
# sudo and read by the services. Nothing secret is here — keys are sealed to the
# TPM and live in the state directory.
d /etc/furcate 0755 root root -

# The release signing certificate, seeded into the trust store.
#
# A signed system extension is merged only if the machine already trusts the
# certificate that signed it, and systemd looks in /etc/verity.d. The package
# cannot ship /etc directly — the same package becomes a system extension, and
# build-sysext.sh refuses anything outside /usr, correctly: /etc holds an
# operator's decisions and must survive an image being replaced wholesale.
#
# So the certificate ships in /usr, where it belongs to the package, and this
# line copies it into /etc, where it becomes the machine's own decision. `C`
# copies only when the destination does not exist, so a machine that already
# trusts a certificate — including one it signed for itself — is left exactly
# as it is. Changing what a machine trusts is not something an upgrade should
# do quietly.
#
# The filename is deliberately not furcate-sign.crt: a node that signs its own
# extensions already uses that name, and every certificate in the directory is
# trusted, so a second file adds the release key without displacing its own.
C /etc/verity.d/furcate-release.crt 0644 root root - /usr/share/furcate/furcate-release.crt
