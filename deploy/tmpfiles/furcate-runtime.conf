# Sole owner of /run/furcate. No unit may manage this directory.
#
# ROOT CAUSE (measured, not inferred). furcated and the other daemons run as
# User=furcate and shipped RuntimeDirectory=furcate. systemd.exec(5): "If the
# specified directories already exist and their owning user or group do not
# match the configured ones, all files and directories below the specified
# directories as well as the directories themselves will have their file
# ownership recursively changed to match what is configured." That chown runs
# on EVERY start, not just the first.
#
# So each time furcated started, /run/furcate flipped to furcate:furcate.
# furcate-wg and furcate-wake-arm run as root but declare
# CapabilityBoundingSet=CAP_NET_ADMIN, and the bounding set caps the permitted
# set, so they do NOT hold CAP_DAC_OVERRIDE. Root without CAP_DAC_OVERRIDE gets
# only the "other" bits on a furcate-owned 0755 directory: r-x, no write.
#
#   /usr/local/bin/furcate-wg: 63: cannot create /run/furcate/wg.json.tmp:
#   Permission denied
#
# Verified by direct experiment on this host:
#   - a User=furcate transient unit with RuntimeDirectory=furcate flipped
#     /run/furcate from root:root to furcate:furcate, contents included
#   - a root unit with CapabilityBoundingSet=CAP_NET_ADMIN writing into that
#     furcate-owned directory returned errno=13 EACCES
#
# The errno is what identifies the mechanism, and rules out the alternatives:
#   EACCES (13) -> ownership/mode check    <- what we actually observed
#   EROFS  (30) -> no writable bind mount
#   ENOENT  (2) -> stale bind, directory unlinked underneath the namespace
#   EPERM   (1) -> seccomp SystemCallFilter denial
# Earlier fixes here targeted the EROFS and ENOENT mechanisms. Neither was ever
# the fault, which is why RuntimeDirectoryPreserve=yes only appeared to help.
#
# THE SHAPE THAT WORKS. Owner root so the root units match on the owner bits
# without needing CAP_DAC_OVERRIDE. Group furcate with g+w so the User=furcate
# units write via the group bits. Setgid so files created here inherit group
# furcate and stay mutually writable across both uid classes. Nothing declares
# RuntimeDirectory=, so nothing ever chowns it again.
#
# systemd-tmpfiles-setup.service runs as part of sysinit.target, ahead of every
# unit below. /run is tmpfs, so this is recreated each boot by design.
d /run/furcate 2775 root furcate -
